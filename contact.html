<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: serif;
      color: white;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                  url("black.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .content-box {
      background: rgba(0, 0, 0, 0.7);
      padding: 40px;
      border-radius: 15px;
      width: 80%;
      max-width: 1200px;
      display: flex;
      gap: 40px;
    }

    .form-section, .info-section {
      flex: 1;
    }

    .divider {
      width: 1px;
      background: rgba(255, 255, 255, 0.3);
      margin: 0 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    input, textarea {
      padding: 12px;
      border: none;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 16px;
    }

    input::placeholder, textarea::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    textarea {
      height: 150px;
      resize: none;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 5px;
      background: #ffffff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #ffffff;
    }

    .info-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .info-item {
      display: flex;
      align-items: center;
      font-size: 1.5rem;
      font-family: serif;
      gap: 20px;
    }

    .social-links {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .social-links a {
      color: white;
      font-size: 24px;
      transition: transform 0.3s;
    }

    .social-links a:hover {
      transform: scale(1.2);
    }

    /* Added responsive design */
    @media (max-width: 768px) {
      .content-box {
        flex-direction: column;
        width: 90%;
        padding: 20px;
      }

      .divider {
        width: 100%;
        height: 1px;
        margin: 20px 0;
      }
    }
  </style>
</head>
<body>
  <div class="content-box">
    <div class="form-section">
     
      <form>
        <input type="text" placeholder="Name" required>
        <input type="email" placeholder="Email" required>
        <input type="tel" placeholder="Phone Number" required>
        <textarea placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>

    <div class="divider"></div>

    <div class="info-section">
      <h2>let's connect</h2>
      
      <div class="info-item">
        <i class="fas fa-user"></i>
        <span>Tanishqa Dwivedi</span>
      </div>
      
      <div class="info-item">
        <i class="fas fa-envelope"></i>
        <span>tanishqadwivedi7@gmail.com</span>
      </div>
      
      <div class="info-item">
        <i class="fas fa-phone"></i>
        <span>(+91) - 8840972644</span>
      </div>
      
      <div class="info-item">
        <i class="fas fa-location-dot"></i>
        <span>Kanpur, Uttar Pradesh, India</span>
      </div>

      <div class="social-links">
        <a href="https://instagram.com/taanniisshhqqaa" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://linkedin.com/in/tanishqa-dwivedi-442659246" target="_blank"><i class="fab fa-linkedin"></i></a>
        <a href="https://twitter.com/tanishqadwivedi" target="_blank"><i class="fab fa-twitter"></i></a>
        <a href="https://github.com/tanishqa107" target="_blank"><i class="fab fa-github"></i></a>
        <a href="https://medium.com/@tanishqadwivedi7" target="_blank"><i class="fab fa-medium"></i></a>
      </div>
    </div>
  </div>
</body>
</html>
