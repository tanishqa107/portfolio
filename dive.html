<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Resume</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-top: 3rem;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: normal;
            margin-top: 0;
            opacity: 0.8;
        }

        .download-container {
            margin-top: 4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50vh;
        }

        .download-button {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: white;
            position: relative;
        }

        .download-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .button-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .download-button:hover .button-image {
            transform: scale(1.1);
        }

        @keyframes iris {
            0% {
                clip-path: circle(0% at center);
            }
            100% {
                clip-path: circle(100% at center);
            }
        }

        .download-button:active .button-image {
            animation: iris 0.6s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Download</h1>
        <h2>Resume that sums up</h2>
    </div>

    <div class="download-container">
        <a href="./logo/recent-fullstack.pdf" class="download-button" download>
            <img src="./logo/down.jpg" alt="Download Resume" class="button-image">
        </a>
    </div>
</body>
</html>
