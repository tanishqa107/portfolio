<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            font-family: sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            margin: 2rem 0;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
            max-width: 1400px;
            padding: 2rem;
        }

        .project-tile {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease;
            cursor: pointer;
            width: 100%;
            aspect-ratio: 16/12;
        }

        .project-tile:hover {
            transform: scale(1.05);
        }

        .project-tile a {
            text-decoration: none;
            color: white;
        }

        .project-content {
            position: relative;
            height: 100%;
        }

        .project-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-title {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 1rem;
            margin: 0;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <h1>Projects</h1>
    <div class="projects-grid">
        <!-- Example tiles -->
        <div class="project-tile">
            <a href="https://3d-calculator-pink.vercel.app/" target="_blank">
                <div class="project-content">
                    <img src="./logo/3d.jpg" alt="Project 1" class="project-image">
                    <h3 class="project-title">3D Calculator</h3>
                </div>
            </a>
        </div>

        <div class="project-tile">
            <a href="https://to-do-list-iota-seven-30.vercel.app/" target="_blank">
                <div class="project-content">
                    <img src="./logo/todo.jpg" alt="Project 2" class="project-image">
                    <h3 class="project-title">To-do list</h3>
                </div>
            </a>
        </div>

        <div class="project-tile">
            <a href="https://photo-booth-rho.vercel.app/" target="_blank">
                <div class="project-content">
                    <img src="./logo/photo.jpeg" alt="Project 3" class="project-image">
                    <h3 class="project-title">Photo Booth</h3>
                </div>
            </a>
        </div>

        <div class="project-tile">
            <a href="https://github.com/tanishqa107/health-care" target="_blank">
                <div class="project-content">
                    <img src="./logo/chatbot.jpg" alt="Project 4" class="project-image">
                    <h3 class="project-title">Healthy Chatbot</h3>
                </div>
            </a>
        </div>

        <div class="project-tile">
            <a href="https://your-vercel-link-5.vercel.app" target="_blank">
                <div class="project-content">
                    <img src="./logo/work7.jpg" alt="Project 5" class="project-image">
                    <h3 class="project-title">Slack Clone</h3>
                </div>
            </a>
        </div>

        <div class="project-tile">
            <a href="https://grocery-shop-swart.vercel.app/" target="_blank">
                <div class="project-content">
                    <img src="./logo/grocery.jpeg" alt="Project 6" class="project-image">
                    <h3 class="project-title">Grocery Shop</h3>
                </div>
            </a>
        </div>

        <div class="project-tile">
            <a href="https://expense-tracker-three-omega-63.vercel.app/" target="_blank">
                <div class="project-content">
                    <img src="./logo/expense.jpeg" alt="Project 7" class="project-image">
                    <h3 class="project-title">Expense Tracker</h3>
                </div>
            </a>
        </div>

        <div class="project-tile">
            <a href="https://product-management-app-six.vercel.app/" target="_blank">
                <div class="project-content">
                    <img src="./logo/product.jpeg" alt="Project 8" class="project-image">
                    <h3 class="project-title">Vendor's App</h3>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
